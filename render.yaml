services:
  - type: web
    name: ultra-next-gen-pro-predictor
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: API_FOOTBALL_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: ADMIN_KEY
        sync: false
      - key: LIVE_POLL_SECONDS
        value: "60"
      - key: UPCOMING_DAYS
        value: "7"
      - key: HISTORY_MATCHES
        value: "10"
